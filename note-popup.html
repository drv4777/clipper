<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 12px; margin: 0; }
    textarea { width: 100%; height: 50px; box-sizing: border-box; margin-bottom: 8px; }
    input { width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 4px 6px; }
    button { padding: 6px 12px; cursor: pointer; }
    label { font-size: 12px; color: #555; }
  </style>
</head>
<body>
  <label>Note (optional)</label>
  <textarea id="note" autofocus></textarea>
  <label>Tags (comma-separated, optional)</label>
  <input type="text" id="tags" placeholder="e.g. idea, work, funny" />
  <button id="save">Save</button>
  <script src="note-popup.js"></script>
</body>
</html>
